aid: citcon
name: Citcon
description: >-
  Citcon is a global payment processing platform, founded in 2015 and
  headquartered in San Jose, California, that unifies 100+ local and global
  payment methods behind a single Universal Payment Interface (UPI) API.
  Merchants use Citcon to accept digital wallets (Alipay, WeChat Pay, PayPal,
  Venmo, CashApp, China UnionPay, Kakao Pay, NaverPay, Line Pay, PayPay and
  more), cards, and Buy Now Pay Later, plus global payouts, pay-by-link,
  surcharging, dual pricing, and in-store/POS acceptance across 50+ countries
  and 10+ settlement currencies. The UPI API is a REST/JSON payments API using
  Bearer access-token authentication with charge, capture, refund, cancel,
  vault (tokenization), inquiry, and consult operations, IPN webhooks, and a
  sandbox environment. Citcon is backed by Norwest Venture Partners and Sierra
  Ventures.
