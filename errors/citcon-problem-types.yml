problems:
- code: '4100'
  title: Duplicate request
  message: duplicate request
  meaning: >-
    A request reused a reference identifier already seen for this merchant.
    Retry with a new unique reference.
- code: '4010'
  title: Unauthorized
  message: unauthorized
  meaning: >-
    The access token is missing, invalid, or expired (also surfaced as HTTP 401).
    Re-issue an access token via POST /v1/access-tokens.
- code: '4208'
  title: Transaction ineligible for partial refund
  message: transaction ineligible for partial refund
  meaning: >-
    A partial refund was requested against a transaction that does not support
    partial refunds.
