    Citcon's UPI is a REST/JSON payments API for accepting 100+ global payment
    methods. It uses Bearer access-token authentication and exposes charge,
    charge-confirm, capture, refund, cancel, transaction inquiry, vault
    (tokenized payment methods), and consult operations, plus IPN webhooks for
    asynchronous payment-status notifications. A sandbox environment is
    available for testing.
